services:
  firefly-api:
    build: .
    container_name: firefly-api
    restart: unless-stopped
    ports:
      - "5055:5055"
    environment:
      - PORT=5055
      - NODE_ENV=production
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    ipc: host
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 1200M
