<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Firefly API Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 36px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
    }
    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;
      font-weight: 700;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(37,99,235,0.25);
      margin: 0 auto 12px;
    }
    .brand-title {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.4px;
    }
    .brand-sub {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
      display: block;
    }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13.5px;
      outline: none;
      transition: all 0.15s ease;
      background: #ffffff;
    }
    .form-control:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }
    .btn-submit {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 22px;
      transition: background 0.15s ease;
    }
    .btn-submit:hover {
      background: #1d4ed8;
    }
    .btn-submit:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .error-msg {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      margin-top: 14px;
      display: none;
      text-align: center;
    }
    .hint-box {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #f1f5f9;
      text-align: center;
      font-size: 11.5px;
      color: #64748b;
    }
    .hint-box strong {
      color: #1e293b;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-header">
      <div class="brand-icon">F</div>
      <div class="brand-title">Firefly API Management</div>
      <div class="brand-sub">Sign in to access your administrative dashboard</div>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="username" class="form-control" value="admin" autocomplete="username" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" value="admin" autocomplete="current-password" required>
      </div>

      <button type="submit" id="loginBtn" class="btn-submit">
        Sign In to Dashboard
      </button>

      <div id="errorMsg" class="error-msg"></div>
    </form>

    <div class="hint-box">
      Initial default credentials: <strong>admin</strong> / <strong>admin</strong>
    </div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const btn = document.getElementById("loginBtn");
    const err = document.getElementById("errorMsg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = "Verifying...";
      err.style.display = "none";

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value.trim()
          })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          // Success! Cookie was set by server, navigate to /
          window.location.href = "/";
        } else {
          err.textContent = data.error || "Invalid username or password";
          err.style.display = "block";
        }
      } catch (e) {
        err.textContent = "Server unreachable: " + e.message;
        err.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign In to Dashboard";
      }
    });
  </script>
</body>
</html>
